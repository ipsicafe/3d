<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>통합11구역 3D 단지모형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen 3D stage, thin title bar on top, control panel bottom-left, legend bottom-right */
:root{
  --bg:#eef2f0; --panel:rgba(255,255,255,.92); --fg:#18242a; --muted:#56656b; --line:#d3dbd8;
  --accent:#1f5f78; --accent-fg:#ffffff; --warn:#8a5a12; --sky:#dfe7ea; --ground:#c9d3cb;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11181b; --panel:rgba(20,29,33,.92); --fg:#e6eeee; --muted:#9aaaae; --line:#2c3a3f;
  --accent:#6fb6d0; --accent-fg:#0d1a1f; --warn:#e2b25d; --sky:#1a2428; --ground:#2a3530; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181b; --panel:rgba(20,29,33,.92); --fg:#e6eeee; --muted:#9aaaae; --line:#2c3a3f;
  --accent:#6fb6d0; --accent-fg:#0d1a1f; --warn:#e2b25d; --sky:#1a2428; --ground:#2a3530; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar h1{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.bar .facts{font-size:.85rem;color:var(--muted)}
.bar .facts b{color:var(--fg);font-weight:500}
.note{width:100%;font-size:.75rem;color:var(--warn)}
.panel{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(300px,calc(100vw - 32px));max-height:52vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(6px)}
.grp{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:.7rem;letter-spacing:.08em;color:var(--muted);font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.btn{font:inherit;font-size:.85rem;padding:6px 10px;border-radius:6px;border:1px solid var(--line);
  background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:.85rem}
.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
.checks input{accent-color:var(--accent)}
.legend{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.8rem;
  display:flex;flex-direction:column;gap:5px;backdrop-filter:blur(6px)}
.legend div{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.tag{position:fixed;z-index:3;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;
  font-size:.78rem;font-weight:500;padding:3px 7px;border-radius:4px;background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.tag.big{font-size:.9rem;font-weight:700;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tag.fl{font-size:.68rem;padding:1px 4px;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:6;pointer-events:none;font-size:.8rem;padding:5px 8px;border-radius:5px;background:var(--fg);color:var(--bg)}
@media (max-width:640px){.legend{bottom:auto;top:calc(96px + env(safe-area-inset-top,0px))}.bar .facts{font-size:.78rem}}
</style>

<div id="stage"></div>

<header class="bar">
  <h1>둔산 통합11구역 3D 단지모형</h1>
  <span class="facts"><b>최고 45층</b> · 유등천 변 <b>20~25층</b> · <b>3개 단지</b> · 보행·통경축 <b>4개</b></span>
  <span class="note">※ 건축계획안 설명자료(2026.10.14)를 바탕으로 만든 참고용 모형입니다. 동 배치·동 수·층수는 실제 설계와 다릅니다.</span>
</header>

<aside class="panel" aria-label="모형 조작">
  <div class="grp">
    <span class="lbl">보기</span>
    <div class="seg" id="mode">
      <button type="button" id="m-plan" data-v="plan" aria-pressed="true">재건축 계획</button>
      <button type="button" id="m-now" data-v="now" aria-pressed="false">현재 단지</button>
    </div>
  </div>
  <div class="grp">
    <span class="lbl">시점</span>
    <div class="seg" id="views">
      <button type="button" id="v-air" data-v="air" aria-pressed="true">조감</button>
      <button type="button" id="v-river" data-v="river" aria-pressed="false">유등천에서</button>
      <button type="button" id="v-park" data-v="park" aria-pressed="false">북측 공원에서</button>
      <button type="button" id="v-top" data-v="top" aria-pressed="false">평면</button>
    </div>
  </div>
  <div class="grp">
    <span class="lbl">표시</span>
    <div class="checks">
      <label><input type="checkbox" id="c-axis" checked> 보행·통경축</label>
      <label><input type="checkbox" id="c-name" checked> 주요 명칭</label>
      <label><input type="checkbox" id="c-floor"> 동별 층수</label>
      <label><input type="checkbox" id="c-ctx" checked> 주변 건물</label>
      <label><input type="checkbox" id="c-rot"> 자동 회전</label>
    </div>
  </div>
  <button type="button" class="btn" id="fs">전체화면</button>
</aside>

<div class="legend" id="legend" aria-label="층수 범례">
  <div><span class="sw" style="background:#3f6d93"></span>36~45층 (고층 타워)</div>
  <div><span class="sw" style="background:#8fb0c6"></span>26~35층</div>
  <div><span class="sw" style="background:#cfdcd2"></span>20~25층 (유등천 변)</div>
  <div><span class="sw" style="background:#4a8fd0"></span>판매시설(상가)</div>
  <div><span class="sw" style="background:#e8c34a"></span>보행·통경축</div>
</div>
<div id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,1,8000);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.08; controls.maxPolarAngle=Math.PI*.49;
controls.minDistance=120; controls.maxDistance=2600; controls.autoRotateSpeed=.6;

function applyTheme(){const c=new THREE.Color(css('--sky'));scene.background=c;scene.fog=new THREE.Fog(c,1800,4200);groundMat.color.set(css('--ground'));}
const groundMat=new THREE.MeshStandardMaterial({color:'#c9d3cb',roughness:1});

// lights
scene.add(new THREE.HemisphereLight(0xffffff,0x56655a,.75));
const sun=new THREE.DirectionalLight(0xfff4e2,.85); sun.position.set(-500,900,450); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-700,right:700,top:700,bottom:-700,near:100,far:2500});
scene.add(sun);

// seeded random
let s=11; const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));

// ground pieces
function plane(w,d,color,x,z,y=0,op=1){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({color,roughness:1,transparent:op<1,opacity:op}));
  m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m;}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),groundMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
plane(140,3000,'#6f9fbf',-500,0,.3);                     // 유등천
plane(40,3000,'#9fbf8a',-410,0,.35);                     // 둔치
plane(620,90,'#8fb57a',0,-395,.4);                       // 북측 공원
const site=[[-340,-130,-235],[-110,100,-5],[120,330,225]]; // 3개 단지 [zMin,zMax,zCenter]
site.forEach(([a,b])=>plane(600,b-a,'#b9cdb2',0,(a+b)/2,.4));
const roadC='#8d9497';
plane(24,800,roadC,-322,0,.45); plane(24,800,roadC,322,0,.45);
plane(668,20,roadC,0,-120,.45); plane(668,20,roadC,0,110,.45); plane(668,22,roadC,0,342,.45); plane(668,20,roadC,0,-350,.45);
// 학교
plane(110,150,'#c7a27b',395,-5,.45);
const school=box(90,16,40,'#e6dfd3',395,-60); scene.add(school);

function box(w,h,d,color,x,z){const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1).translate(0,.5,0),new THREE.MeshStandardMaterial({color,roughness:.7}));
  m.castShadow=true;m.receiveShadow=true;g.add(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1).translate(0,.5,0)),new THREE.LineBasicMaterial({color:0x2c3a40,transparent:true,opacity:.35}));
  g.add(e);g.scale.set(w,h,d);g.position.set(x,0,z);g.userData.mesh=m;return g;}

// 축·광장
const axisGrp=new THREE.Group();scene.add(axisGrp);
const axMat=new THREE.MeshBasicMaterial({color:'#e8c34a',transparent:true,opacity:.7,depthWrite:false});
function strip(w,d,x,z){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),axMat);m.rotation.x=-Math.PI/2;m.position.set(x,.8,z);axisGrp.add(m);}
function arrow(x,z,rot){const sh=new THREE.Shape();sh.moveTo(0,22);sh.lineTo(-20,-6);sh.lineTo(20,-6);sh.closePath();
  const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),axMat);m.rotation.x=-Math.PI/2;m.rotation.z=rot;m.position.set(x,.85,z);axisGrp.add(m);}
strip(26,760,0,-50); arrow(0,-440,0);
site.forEach(([,,zc])=>{strip(760,22,-80,zc);arrow(-470,zc,Math.PI/2);});
site.forEach(([,,zc])=>{const p=new THREE.Mesh(new THREE.CircleGeometry(34,40),new THREE.MeshStandardMaterial({color:'#efe9d8',roughness:1}));
  p.rotation.x=-Math.PI/2;p.position.set(0,.9,zc);p.receiveShadow=true;axisGrp.add(p);});

// 계획 동 배치(추정)
const cols=[{x:-250,t:'s',w:44,f:[20,23]},{x:-195,t:'s',w:40,f:[23,25]},{x:-135,t:'t',f:[33,37]},{x:-70,t:'t',f:[40,44]},
            {x:70,t:'t',f:[40,44]},{x:135,t:'t',f:[35,39]},{x:205,t:'s',w:44,f:[30,34]},{x:260,t:'s',w:44,f:[27,30]}];
const bandColor=f=>f>=36?'#3f6d93':f>=26?'#8fb0c6':'#cfdcd2';
const planGrp=new THREE.Group(),nowGrp=new THREE.Group(),ctxGrp=new THREE.Group();scene.add(planGrp,nowGrp,ctxGrp);
const planB=[],nowB=[],foot=[];
site.forEach(([a,b,zc],si)=>{
  const rows=[zc-82,zc-38,zc+38,zc+82]; let peak=null;
  rows.forEach(z=>cols.forEach(c=>{
    let f=ri(c.f[0],c.f[1]); const w=c.t==='t'?24:c.w,d=c.t==='t'?24:14;
    const g=box(w,f*3,d,bandColor(f),c.x,z); g.userData.floors=f; g.userData.type=c.t==='t'?'타워형':'판상형';
    planGrp.add(g);planB.push(g);foot.push([c.x-w/2-4,c.x+w/2+4,z-d/2-4,z+d/2+4]);
    if(c.t==='t'&&Math.abs(c.x)===70&&(!peak||rnd()<.3))peak=g;}));
  // 단지마다 최고 45층 1개 동
  peak.userData.floors=45;peak.scale.y=135;peak.userData.mesh.material.color.set(bandColor(45));
});
// 판매시설
const shop=box(14,12,170,'#4a8fd0',-291,235);shop.userData.floors=3;shop.userData.type='판매시설';planGrp.add(shop);planB.push(shop);
// 현재 단지(15층 내외 판상형)
site.forEach(([,,zc])=>[zc-80,zc-28,zc+28,zc+80].forEach(z=>[-235,-118,0,118,235].forEach(x=>{
  const f=ri(13,15);const g=box(64,f*3,12,'#d9d1c1',x,z);g.userData.floors=f;g.userData.type='현재 아파트';nowGrp.add(g);nowB.push(g);})));
nowGrp.visible=false;
// 주변 건물
for(let x=360;x<=900;x+=70)for(let z=-700;z<=800;z+=55){if(x<470&&z>-110&&z<100)continue;if(rnd()<.35)continue;
  const g=box(46,ri(8,15)*3,12,'#cfd3d2',x+ri(-8,8),z);g.userData.mesh.material.transparent=true;g.userData.mesh.material.opacity=.75;ctxGrp.add(g);}
for(let x=-300;x<=330;x+=70)for(let z=420;z<=800;z+=55){if(rnd()<.35)continue;
  const g=box(46,ri(8,15)*3,12,'#cfd3d2',x,z);g.userData.mesh.material.transparent=true;g.userData.mesh.material.opacity=.75;ctxGrp.add(g);}
for(let x=-300;x<=330;x+=70)for(let z=-780;z<=-470;z+=55){if(rnd()<.4)continue;
  const g=box(46,ri(8,15)*3,12,'#cfd3d2',x,z);g.userData.mesh.material.transparent=true;g.userData.mesh.material.opacity=.75;ctxGrp.add(g);}

// 조경 수목
const treeGeo=new THREE.SphereGeometry(1,7,5);const treeMat=new THREE.MeshStandardMaterial({color:'#5d8a55',roughness:1});
const pts=[];const ok=(x,z)=>!foot.some(([x0,x1,z0,z1])=>x>x0&&x<x1&&z>z0&&z<z1)&&Math.abs(x)>16&&!site.some(([,,zc])=>Math.abs(z-zc)<14)&&!(x<-282&&z>145);
let guard=0;while(pts.length<1500&&guard++<20000){const si=ri(0,2);const [a,b]=site[si];const x=-295+rnd()*590,z=a+5+rnd()*(b-a-10);if(ok(x,z))pts.push([x,z,4+rnd()*3]);}
for(let i=0;i<500;i++)pts.push([-300+rnd()*600,-432+rnd()*74,5+rnd()*3]);
for(let i=0;i<260;i++)pts.push([-425+rnd()*28,-1400+rnd()*2800,4+rnd()*2]);
const trees=new THREE.InstancedMesh(treeGeo,treeMat,pts.length);const mtx=new THREE.Matrix4();
pts.forEach(([x,z,r],i)=>{mtx.compose(new THREE.Vector3(x,r*1.1,z),new THREE.Quaternion(),new THREE.Vector3(r,r*1.25,r));trees.setMatrixAt(i,mtx);});
trees.castShadow=true;scene.add(trees);

// 라벨
const tags=[];
function tag(text,x,y,z,cls,grp){const el=document.createElement('div');el.className='tag '+(cls||'');el.textContent=text;document.body.appendChild(el);
  const t={el,p:new THREE.Vector3(x,y,z),grp};tags.push(t);return t;}
const names=[tag('유등천',-500,10,-150,'big','name'),tag('북측 공원 (기부채납)',0,12,-395,'','name'),tag('학교',395,30,-60,'','name'),
  tag('판매시설 · 학원가 상가',-291,30,235,'','name'),tag('단지 구분 도로',150,8,-120,'','name'),tag('단지 구분 도로',150,8,110,'','name')];
site.forEach(([,,zc],i)=>names.push(tag('중앙광장',0,6,zc,'','name')));
names.push(tag('남북 보행·통경축',0,6,-440,'','axis'));
const floorTags=planB.filter(b=>b!==shop).map(b=>tag(b.userData.floors+'층',b.position.x,b.userData.floors*3+6,b.position.z,'fl','floor'));
const nowTags=nowB.map(b=>tag(b.userData.floors+'층',b.position.x,b.userData.floors*3+6,b.position.z,'fl','floorNow'));

// 상태
const st={mode:'plan',axis:true,name:true,floor:false};
const $=id=>document.getElementById(id);
function setPressed(gid,v){document.querySelectorAll('#'+gid+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));}
function grow(list){const t0=performance.now();list.forEach(g=>{g.userData.h=g.userData.floors*3;g.scale.y=.01;});
  (function step(t){const k=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-k,3);list.forEach((g,i)=>{const d=Math.min(1,Math.max(0,e*1.4-(i%9)*.04));g.scale.y=Math.max(.01,g.userData.h*d);});if(k<1)requestAnimationFrame(step);else list.forEach(g=>g.scale.y=g.userData.h);})(t0);}
$('mode').addEventListener('click',e=>{const v=e.target.dataset&&e.target.dataset.v;if(!v||v===st.mode)return;st.mode=v;setPressed('mode',v);
  planGrp.visible=v==='plan';nowGrp.visible=v==='now';refresh();grow(v==='plan'?planB:nowB);});
$('c-axis').onchange=e=>{st.axis=e.target.checked;refresh();};
$('c-name').onchange=e=>{st.name=e.target.checked;};
$('c-floor').onchange=e=>{st.floor=e.target.checked;};
$('c-ctx').onchange=e=>{ctxGrp.visible=e.target.checked;};
$('c-rot').onchange=e=>{controls.autoRotate=e.target.checked;};
function refresh(){axisGrp.visible=st.axis&&st.mode==='plan';}
$('fs').onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}catch(_){}};

// 시점
const views={air:[[-760,560,820],[0,30,0]],river:[[-900,90,-60],[0,60,-20]],park:[[60,130,-900],[0,60,0]],top:[[0,1500,1],[0,0,0]]};
function fly(k){setPressed('views',k);const [p,t]=views[k];const p0=camera.position.clone(),t0=controls.target.clone(),p1=new THREE.Vector3(...p),t1=new THREE.Vector3(...t);const s0=performance.now();
  (function step(n){const k2=Math.min(1,(n-s0)/1300),e=k2<.5?4*k2*k2*k2:1-Math.pow(-2*k2+2,3)/2;camera.position.lerpVectors(p0,p1,e);controls.target.lerpVectors(t0,t1,e);if(k2<1)requestAnimationFrame(step);})(s0);}
$('views').addEventListener('click',e=>{const v=e.target.dataset&&e.target.dataset.v;if(v)fly(v);});
camera.position.set(-760,560,820);controls.target.set(0,30,0);

// 툴팁
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=$('tip');
renderer.domElement.addEventListener('pointermove',e=>{const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mouse,camera);const list=(st.mode==='plan'?planB:nowB).map(g=>g.userData.mesh);const hit=ray.intersectObjects(list)[0];
  if(hit){const g=hit.object.parent;tip.hidden=false;tip.textContent=g.userData.type==='판매시설'?'판매시설 (상가·학원가)':`${g.userData.type} · 약 ${g.userData.floors}층 (모형 추정)`;
    tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';}else tip.hidden=true;});
renderer.domElement.addEventListener('pointerleave',()=>tip.hidden=true);

// 렌더
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
const v=new THREE.Vector3();
function showTag(t){if(t.grp==='name')return st.name;if(t.grp==='axis')return st.name&&st.axis&&st.mode==='plan';
  if(t.grp==='floor')return st.floor&&st.mode==='plan';if(t.grp==='floorNow')return st.floor&&st.mode==='now';return true;}
function loop(){controls.update();renderer.render(scene,camera);const w=window.innerWidth,h=window.innerHeight;
  tags.forEach(t=>{if(!showTag(t)){t.el.hidden=true;return;}v.copy(t.p).project(camera);
    if(v.z>1||Math.abs(v.x)>1.1||Math.abs(v.y)>1.1){t.el.hidden=true;return;}t.el.hidden=false;t.el.style.left=((v.x+1)/2*w)+'px';t.el.style.top=((1-v.y)/2*h)+'px';});
  requestAnimationFrame(loop);}
applyTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(_){}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
loop();
})();
</script>
